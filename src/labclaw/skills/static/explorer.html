<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Explorer - Cloud Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111319;--card:#191b22;--card-hover:#1e1f26;
  --blue:#2563eb;--purple:#8b5cf6;--green:#16a34a;--amber:#f59e0b;
  --text:#e2e8f0;--text-dim:#94a3b8;--text-muted:#64748b;
  --radius:1rem;
}
html{font-size:15px;-webkit-font-smoothing:antialiased}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.6;min-height:100vh;
}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-0.02em}
code,pre,.mono{font-family:'JetBrains Mono',monospace}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}

.container{max-width:1200px;margin:0 auto;padding:0 1.5rem}
section{margin-bottom:3rem}

.header{padding:2rem 0 1.5rem;text-align:center}
.header h1{font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block}
.header .subtitle{color:var(--text-dim);font-size:1rem;margin-top:0.4rem;font-weight:400}

.glass{
  background:rgba(25,27,34,0.8);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:var(--radius);
  padding:1.5rem;
  transition:background 0.2s;
}
.glass:hover{background:rgba(30,31,38,0.9)}

.section-title{
  font-size:1.15rem;font-weight:700;color:var(--text);
  margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem;
}
.section-title .badge{
  font-size:0.65rem;font-weight:600;
  padding:0.15rem 0.55rem;border-radius:1rem;
  background:rgba(37,99,235,0.15);color:var(--blue);
  letter-spacing:0.04em;text-transform:uppercase;
}

input[type="text"],select,textarea{
  width:100%;padding:0.7rem 1rem;
  background:rgba(15,17,23,0.6);color:var(--text);
  border:1px solid rgba(100,116,139,0.15);border-radius:0.6rem;
  font-family:inherit;font-size:0.9rem;
  outline:none;transition:border-color 0.2s,box-shadow 0.2s;
}
input[type="text"]:focus,select:focus,textarea:focus{
  border-color:rgba(37,99,235,0.4);
  box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;
  padding:0.65rem 1.5rem;border-radius:0.6rem;
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:0.85rem;
  cursor:pointer;border:none;transition:all 0.2s;
  letter-spacing:0.01em;
}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#1d4ed8;box-shadow:0 4px 20px rgba(37,99,235,0.3)}
.btn-primary:active{transform:scale(0.97)}
.btn-ghost{
  background:rgba(100,116,139,0.08);color:var(--text-dim);
  padding:0.5rem 1rem;font-size:0.78rem;
}
.btn-ghost:hover{background:rgba(100,116,139,0.15);color:var(--text)}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.75rem;border-radius:0.4rem}

/* top nav */
.top-nav{
  position:sticky;top:0;z-index:100;
  background:rgba(17,19,25,0.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(100,116,139,0.1);
}
.nav-inner{
  max-width:1200px;margin:0 auto;padding:0.7rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-brand{
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.1rem;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-decoration:none;
}
.nav-links{display:flex;gap:0.25rem}
.nav-link{
  padding:0.4rem 0.85rem;border-radius:0.5rem;
  font-size:0.82rem;font-weight:600;color:var(--text-dim);
  text-decoration:none;transition:all 0.2s;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.nav-link:hover{color:var(--text);background:rgba(100,116,139,0.1)}
.nav-link.active{color:var(--blue);background:rgba(37,99,235,0.1)}

/* layout */
.explorer-layout{
  display:grid;grid-template-columns:220px 1fr;gap:1.5rem;
  align-items:start;
}
@media(max-width:768px){.explorer-layout{grid-template-columns:1fr}}

/* sidebar */
.sidebar{position:sticky;top:5rem}
.sidebar-title{font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.75rem}
.cat-list{list-style:none;display:flex;flex-direction:column;gap:0.2rem}
.cat-item{
  padding:0.5rem 0.75rem;border-radius:0.5rem;
  font-size:0.82rem;color:var(--text-dim);cursor:pointer;
  transition:all 0.2s;display:flex;justify-content:space-between;align-items:center;
}
.cat-item:hover{background:rgba(100,116,139,0.1);color:var(--text)}
.cat-item.active{background:rgba(37,99,235,0.12);color:var(--blue)}
.cat-item .count{
  font-size:0.7rem;font-weight:600;
  background:rgba(100,116,139,0.12);padding:0.1rem 0.45rem;border-radius:1rem;
  color:var(--text-muted);min-width:1.5rem;text-align:center;
}
.cat-item.active .count{background:rgba(37,99,235,0.2);color:var(--blue)}

/* search bar */
.search-bar{
  display:flex;gap:0.75rem;align-items:center;margin-bottom:1.25rem;
}
.search-bar input{flex:1}
.search-stats{font-size:0.78rem;color:var(--text-muted);white-space:nowrap}

/* tool grid */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}

.tool-card{
  background:rgba(25,27,34,0.7);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:var(--radius);padding:1.25rem;
  transition:all 0.25s;cursor:pointer;
  position:relative;overflow:hidden;
}
.tool-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  opacity:0;transition:opacity 0.25s;
}
.tool-card:hover{background:rgba(30,31,38,0.85);transform:translateY(-2px)}
.tool-card:hover::before{opacity:1}
.tool-card-name{
  font-family:'Plus Jakarta Sans',sans-serif;font-size:0.9rem;font-weight:700;
  margin-bottom:0.35rem;word-break:break-all;
}
.tool-card-desc{
  color:var(--text-muted);font-size:0.78rem;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:0.75rem;min-height:3.5em;
}
.tool-card-actions{display:flex;gap:0.5rem;align-items:center}
.tool-tag{
  font-size:0.65rem;font-weight:600;padding:0.15rem 0.5rem;border-radius:1rem;
  background:rgba(139,92,246,0.12);color:var(--purple);
}

/* spec modal */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:2rem;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--card);border-radius:var(--radius);
  max-width:700px;width:100%;max-height:80vh;overflow:auto;
  padding:2rem;position:relative;
  animation:fadeUp 0.3s ease-out;
}
.modal-close{
  position:absolute;top:1rem;right:1rem;
  background:rgba(100,116,139,0.15);border:none;color:var(--text-dim);
  width:2rem;height:2rem;border-radius:0.4rem;cursor:pointer;
  font-size:1.1rem;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.modal-close:hover{background:rgba(100,116,139,0.3);color:var(--text)}
.modal h2{font-size:1.3rem;margin-bottom:0.5rem}
.modal .spec-desc{color:var(--text-dim);font-size:0.88rem;margin-bottom:1rem}
.modal pre{
  background:rgba(10,12,18,0.8);border-radius:0.6rem;
  padding:1rem;font-size:0.78rem;line-height:1.65;
  overflow-x:auto;max-height:400px;
}

/* json syntax */
.json-key{color:#93c5fd}
.json-str{color:#86efac}
.json-num{color:#fbbf24}
.json-bool{color:#c084fc}
.json-null{color:#f87171}
.json-bracket{color:#94a3b8}

.spinner{
  width:14px;height:14px;border:2px solid rgba(37,99,235,0.2);
  border-top-color:var(--blue);border-radius:50%;
  animation:spin 0.8s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}

.loading-center{text-align:center;padding:3rem;color:var(--text-muted);font-size:0.88rem}
.empty-state{text-align:center;padding:3rem;color:var(--text-muted);font-size:0.88rem}

.footer{text-align:center;padding:2rem 0 3rem;color:var(--text-muted);font-size:0.75rem}
.footer a{color:var(--blue);text-decoration:none}
.footer a:hover{text-decoration:underline}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeUp 0.5s ease-out both}
.fade-in:nth-child(2){animation-delay:0.05s}
.fade-in:nth-child(3){animation-delay:0.1s}
</style>
</head>
<body>

<!-- Top Navigation -->
<nav class="top-nav">
  <div class="nav-inner">
    <a href="brain.html" class="nav-brand">&#x1F9E0; Cloud Brain</a>
    <div class="nav-links">
      <a href="brain.html" class="nav-link">Dashboard</a>
      <a href="explorer.html" class="nav-link active">Explorer</a>
      <a href="playground.html" class="nav-link">Playground</a>
      <a href="docs.html" class="nav-link">Docs</a>
    </div>
  </div>
</nav>

<div class="container">

  <header class="header fade-in">
    <h1>Tool Explorer</h1>
    <p class="subtitle">Browse, search, and inspect 2,400+ scientific tools</p>
  </header>

  <section class="fade-in">
    <div class="explorer-layout">

      <!-- Sidebar: Categories -->
      <aside class="sidebar glass">
        <div class="sidebar-title">Categories</div>
        <ul class="cat-list" id="catList">
          <li class="cat-item active" data-category="all" onclick="filterCategory('all')">
            <span>All Tools</span>
            <span class="count" id="allCount">--</span>
          </li>
        </ul>
        <div id="catLoading" class="loading-center" style="padding:1rem"><div class="spinner"></div></div>
      </aside>

      <!-- Main content -->
      <div>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search tools by name or description...">
          <span class="search-stats" id="searchStats">Loading...</span>
        </div>
        <div class="tool-grid" id="toolGrid">
          <div class="loading-center" style="grid-column:1/-1"><div class="spinner"></div> Loading tools...</div>
        </div>
      </div>

    </div>
  </section>

  <footer class="footer">
    Cloud Brain &mdash; LabClaw Scientific AI Platform &mdash; <a href="docs.html">API Docs</a>
  </footer>

</div>

<!-- Spec Modal -->
<div class="modal-overlay" id="specModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2 id="specTitle">Tool Spec</h2>
    <p class="spec-desc" id="specDesc"></p>
    <div style="display:flex;gap:0.5rem;margin-bottom:1rem">
      <a class="btn btn-primary btn-sm" id="specTryBtn" href="#">Try in Playground</a>
    </div>
    <pre id="specBody"><div class="spinner"></div> Loading spec...</pre>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let allTools = [];
let categories = [];
let activeCategory = 'all';

// ---------------------------------------------------------------------------
// Bootstrap
// ---------------------------------------------------------------------------
document.addEventListener('DOMContentLoaded', () => {
  fetchTools();
  fetchCategories();
  document.getElementById('searchInput').addEventListener('input', onSearch);
  document.getElementById('specModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
});

// ---------------------------------------------------------------------------
// Fetch tools
// ---------------------------------------------------------------------------
async function fetchTools() {
  try {
    const res = await fetch('/brain/tools');
    if (!res.ok) throw new Error(res.status);
    allTools = await res.json();
    document.getElementById('allCount').textContent = allTools.length;
    document.getElementById('searchStats').textContent = allTools.length + ' tools';
    renderTools(allTools);
  } catch (e) {
    document.getElementById('toolGrid').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1">Failed to load tools. Is the API running?</div>';
    document.getElementById('searchStats').textContent = 'Error';
  }
}

// ---------------------------------------------------------------------------
// Fetch categories
// ---------------------------------------------------------------------------
async function fetchCategories() {
  const loader = document.getElementById('catLoading');
  try {
    const res = await fetch('/brain/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tool_name: 'tu_list_categories', arguments: {} }),
    });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    // data.result could be array of strings or objects
    const result = data.result || data;
    if (Array.isArray(result)) {
      categories = result.map(c => typeof c === 'string' ? c : (c.name || c.category || String(c)));
    } else if (typeof result === 'object') {
      categories = Object.keys(result);
    }
    loader.style.display = 'none';
    renderCategories();
  } catch (e) {
    loader.innerHTML = '<span style="font-size:0.75rem;color:var(--text-muted)">Could not load categories</span>';
  }
}

function renderCategories() {
  const list = document.getElementById('catList');
  categories.forEach(cat => {
    const li = document.createElement('li');
    li.className = 'cat-item';
    li.dataset.category = cat;
    li.onclick = () => filterCategory(cat);
    const count = allTools.filter(t => matchesCategory(t, cat)).length;
    li.innerHTML = '<span>' + escHtml(truncate(cat, 22)) + '</span><span class="count">' + count + '</span>';
    li.title = cat;
    list.appendChild(li);
  });
}

function matchesCategory(tool, cat) {
  const name = (tool.name || '').toLowerCase();
  const desc = (tool.description || '').toLowerCase();
  const catLower = cat.toLowerCase();
  return name.includes(catLower) || desc.includes(catLower);
}

function filterCategory(cat) {
  activeCategory = cat;
  // Update active state
  document.querySelectorAll('.cat-item').forEach(el => {
    el.classList.toggle('active', el.dataset.category === cat);
  });
  applyFilters();
}

// ---------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------
function onSearch() {
  applyFilters();
}

function applyFilters() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  let filtered = allTools;

  if (activeCategory !== 'all') {
    filtered = filtered.filter(t => matchesCategory(t, activeCategory));
  }

  if (query) {
    filtered = filtered.filter(t =>
      (t.name || '').toLowerCase().includes(query) ||
      (t.description || '').toLowerCase().includes(query)
    );
  }

  document.getElementById('searchStats').textContent = filtered.length + ' of ' + allTools.length + ' tools';
  renderTools(filtered);
}

// ---------------------------------------------------------------------------
// Render tools
// ---------------------------------------------------------------------------
function renderTools(tools) {
  const grid = document.getElementById('toolGrid');
  if (tools.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No tools match your search.</div>';
    return;
  }

  // Render max 200 at a time for performance
  const display = tools.slice(0, 200);
  grid.innerHTML = '';
  display.forEach(tool => {
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.onclick = () => showSpec(tool.name);

    const desc = tool.description || 'No description available';
    card.innerHTML =
      '<div class="tool-card-name">' + escHtml(tool.name) + '</div>' +
      '<div class="tool-card-desc">' + escHtml(desc) + '</div>' +
      '<div class="tool-card-actions">' +
        '<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();goPlayground(\'' + escAttr(tool.name) + '\')">Try</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showSpec(\'' + escAttr(tool.name) + '\')">Spec</button>' +
      '</div>';
    grid.appendChild(card);
  });

  if (tools.length > 200) {
    const more = document.createElement('div');
    more.className = 'empty-state';
    more.style.gridColumn = '1/-1';
    more.textContent = 'Showing 200 of ' + tools.length + ' tools. Use search to narrow results.';
    grid.appendChild(more);
  }
}

// ---------------------------------------------------------------------------
// Spec modal
// ---------------------------------------------------------------------------
async function showSpec(toolName) {
  const modal = document.getElementById('specModal');
  const title = document.getElementById('specTitle');
  const desc = document.getElementById('specDesc');
  const body = document.getElementById('specBody');
  const tryBtn = document.getElementById('specTryBtn');

  title.textContent = toolName;
  desc.textContent = 'Loading...';
  body.innerHTML = '<div class="spinner"></div> Fetching spec...';
  tryBtn.href = 'playground.html?tool=' + encodeURIComponent(toolName);
  modal.classList.add('open');

  try {
    const res = await fetch('/brain/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tool_name: 'tu_get_spec', arguments: { name: toolName } }),
    });
    const data = await res.json();

    const spec = data.result || data;
    const specDesc = (typeof spec === 'object' && spec.description) ? spec.description : '';
    desc.textContent = specDesc || 'No description';
    body.innerHTML = syntaxHighlight(spec);
  } catch (e) {
    desc.textContent = '';
    body.textContent = 'Failed to load spec: ' + e.message;
  }
}

function closeModal() {
  document.getElementById('specModal').classList.remove('open');
}

function goPlayground(toolName) {
  window.location.href = 'playground.html?tool=' + encodeURIComponent(toolName);
}

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function escAttr(s) {
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + '...' : s;
}

function syntaxHighlight(obj) {
  const json = JSON.stringify(obj, null, 2);
  if (!json) return '';
  return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"([^"]+)"(?=\s*:)/g, '<span class="json-key">"$1"</span>')
    .replace(/:\s*"([^"]*)"/g, ': <span class="json-str">"$1"</span>')
    .replace(/:\s*(\d+\.?\d*)/g, ': <span class="json-num">$1</span>')
    .replace(/:\s*(true|false)/g, ': <span class="json-bool">$1</span>')
    .replace(/:\s*(null)/g, ': <span class="json-null">$1</span>')
    .replace(/([[\]{}])/g, '<span class="json-bracket">$1</span>');
}
</script>
</body>
</html>
